<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ</title>
    <style>
        header{
            background-color: brown;
            height: 150px;
        }
        header h1{
            font-size: 64px;
            color: white;
            font-weight: bold;
            padding-top: 30px;
            margin-left: 25px;
        }
        nav{
            height: 50px;
            border: 1px solid white;
            background-color: rgb(153, 74, 74);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        nav a{
            color: white;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover{
            background-color: white;
            color: brown;
            padding-block: 12px;
        }
        main{
            height: 500px;
            background-color: blanchedalmond;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 5px;
        }
        main table{
            background-color: white;
            height: 300px;
            width: 350px;
            border: 1px solid black;
            margin: 0;
            text-align: center;
            padding: 10px;
        }
        main h1{
            color: red;
            font-size: 24px;
        }
        main span{
            font-size: 18px;
        }
        main img{
            height: 500px;
        }
        footer{
            height: 130px;
            color: white;
            border: 1px solid brown;
            background-color: brown;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        footer h2{
            font-size: 14px;
            text-align: center;
        }
        footer a{
            color: yellow;
        }
    </style>
</head>
<body>
    <header>
        <h1>Thông tin liên hệ</h1>
    </header>
    <nav>
        <a href="../index.html" target="_blank">Trang chủ</a>
        <a href="./gioithieu.html" target="_blank">Giới thiệu</a>
        <a href="./sanpham.html" target="_blank">Sản phẩm</a>
        <a href="./lienhe.html" target="_blank">Liên hệ</a>
    </nav>
    <main>
        <h1>Gửi yêu cầu để được tư vấn</h1>
        <table>
            <tr>
                <td>
                    <label for="tcb">Tên của bạn</label>
                </td>
                <td>
                    <input type="text" name="txttcb" id="tcb" placeholder="Nhập tên của bạn"> <br>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email của bạn</label>
                </td>
                <td>
                    <input type="text" name="txtemail" id="email" placeholder="Nhập Email của bạn">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="sdt">SĐT của bạn</label>
                </td>
                <td>
                    <input type="text" name="txtsdt" id="sodt" placeholder="Nhập SĐT của bạn">
            </tr>
            <tr>
                <td>
                    <label for="nd">Nội dung yêu cầu</label>
                </td>
                <td>
                    <textarea name="noidung" id="nd" cols="20" rows="10"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="button" value="Gửi yêu cầu" name="bngui" onclick="alert('Bạn đã gửi thành công')">
                </td>
            </tr>
        </table>
    </main>
    <footer>
        <h2>
            CÔNG TY CỔ PHẦN PIANO STORE <br>
            Hotline: 0788765009 <br>
            Cơ sở: 567 Nguyễn Huệ, Cao Lãnh, Đồng Tháp <br>
            Website:
            <br><br>
            © Nguồn tham khảo: <a href="#">Cecilia</a>
        </h2>
    </footer>
</body>
</html>
